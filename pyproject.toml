[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-validation"
version = "0.1.0"
description = "SZL × Chad Barnard: Acoustic validation framework — Burgers equation, Duffing oscillator, Aero-FF falsifiable tests. Governed by IMMUNE receipts, served via NEXUS, monetized via x402."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = ["numpy==2.4.6"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/acoustic-validation"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
