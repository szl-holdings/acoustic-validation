version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # NumPy 2.5+ requires Python >=3.12. The test matrix still includes 3.11.
      # Drop this ignore only when that job is removed on purpose.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
